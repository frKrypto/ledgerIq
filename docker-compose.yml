# Local development database.
#
# Note the two roles the test harness and app use: migrations run as the owner,
# traffic runs as ledgeriq_app (NOSUPERUSER, NOBYPASSRLS). Connecting the app as
# the owner would silently disable every RLS policy — see docs/03-engineering/security.md §3.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ledgeriq_dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

volumes:
  pgdata:
