<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LedgerIQ</title>
<style>
/* Design tokens: the validated set from docs/02-design/design-system.md §2.
   Every categorical and status colour passed CVD-separation and contrast checks
   in both light and dark modes. */
:root{color-scheme:light;
--surface-page:#f6f6f4;--surface-1:#fbfbfa;--surface-2:#f0f0ed;
--border-subtle:#e3e3df;--border-strong:#c9c9c3;
--text-primary:#111417;--text-secondary:#4e5459;--text-muted:#767c82;
--brand:#0f8a6a;--brand-hover:#0b6b53;--brand-subtle:#e7f5ef;
--s1:#0f8a6a;--s2:#2a78d6;--s3:#eb6834;--s4:#4a3aa7;
--positive:#0e7c5a;--caution:#9a6100;--serious:#b4480f;--critical:#c2312f;--critical-subtle:#fdeceb;
--font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--font-reading:"Source Serif 4","Iowan Old Style",Georgia,serif;--r:10px;--rc:6px}
@media(prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;
--surface-page:#0b0e11;--surface-1:#111417;--surface-2:#181c20;
--border-subtle:#232830;--border-strong:#333a44;
--text-primary:#f4f5f3;--text-secondary:#a8b0b8;--text-muted:#6f777f;
--brand:#14a37d;--brand-hover:#34b489;--brand-subtle:#0d2a22;
--s1:#14a37d;--s2:#3987e5;--s3:#d95926;--s4:#9085e9;
--positive:#3fbf94;--caution:#e0a63c;--serious:#f08a4b;--critical:#f2706e;--critical-subtle:#2a1416}}
:root[data-theme=dark]{color-scheme:dark;
--surface-page:#0b0e11;--surface-1:#111417;--surface-2:#181c20;
--border-subtle:#232830;--border-strong:#333a44;
--text-primary:#f4f5f3;--text-secondary:#a8b0b8;--text-muted:#6f777f;
--brand:#14a37d;--brand-hover:#34b489;--brand-subtle:#0d2a22;
--s1:#14a37d;--s2:#3987e5;--s3:#d95926;--s4:#9085e9;
--positive:#3fbf94;--caution:#e0a63c;--serious:#f08a4b;--critical:#f2706e;--critical-subtle:#2a1416}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--surface-page);color:var(--text-primary);
font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;
background:linear-gradient(to right,var(--surface-1) 0 220px,var(--surface-page) 220px)}
.nav{border-right:1px solid var(--border-subtle);padding:20px 12px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;padding:4px 10px 22px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.logo .iq{color:var(--brand)}
.nav a{display:flex;gap:10px;padding:7px 10px;border-radius:var(--rc);color:var(--text-secondary);
text-decoration:none;font-size:14px;font-weight:500}
.nav a.on{background:var(--brand-subtle);color:var(--brand)}
.nav a:hover:not(.on){background:var(--surface-2)}
.topbar{height:56px;border-bottom:1px solid var(--border-subtle);background:var(--surface-1);
display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:10}
.org{font-weight:600;font-size:14px}.sp{flex:1}
.fresh{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary);
background:var(--surface-2);padding:5px 11px;border-radius:100px;border:1px solid var(--border-subtle)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--positive)}
.iconbtn{width:32px;height:32px;border-radius:var(--rc);border:1px solid var(--border-subtle);
background:var(--surface-1);color:var(--text-secondary);cursor:pointer}
.page{padding:28px 24px 64px;max-width:1240px}
h1.greet{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:20px}
.answerbar{background:var(--surface-1);border:1px solid var(--border-subtle);border-left:3px solid var(--brand);
border-radius:var(--r);padding:22px 24px;margin-bottom:24px}
.answerbar p{font-family:var(--font-reading);font-size:17.5px;line-height:1.55;margin-bottom:8px}
.answerbar p.lead{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.tile{background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.tile:hover{border-color:var(--brand)}
.tile .lbl{font-size:12.5px;color:var(--text-secondary);font-weight:500}
.tile .val{font-size:27px;font-weight:600;letter-spacing:-.025em;margin:5px 0 3px}
.tile .chg{font-size:12.5px;font-weight:500}
.up{color:var(--positive)}.down{color:var(--critical)}
.tile .meta{font-size:11.5px;color:var(--text-muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--border-subtle)}
.card{background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r);margin-bottom:20px}
.card-h{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--border-subtle)}
.card-h h2{font-size:15.5px;font-weight:600}
.card-b{padding:20px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:14px 20px 0;font-size:12.5px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:14px;height:3px;border-radius:2px}
.sw.band{height:10px;opacity:.18;background:var(--s1)}
.sw.dash{background:repeating-linear-gradient(90deg,var(--s1) 0 4px,transparent 4px 7px)}
.risk{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--border-subtle);font-size:14px}
.glyph{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.glyph.crit{background:var(--critical-subtle);color:var(--critical)}
.glyph.warn{background:var(--surface-2);color:var(--caution)}
.pill{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:100px}
.pill.crit{background:var(--critical-subtle);color:var(--critical)}
.pill.warn{background:var(--surface-2);color:var(--caution)}
.alert{background:var(--surface-1);border:1px solid var(--border-subtle);border-left:3px solid var(--critical);
border-radius:var(--r);padding:20px 22px;margin-bottom:20px}
.alert .hd{display:flex;gap:9px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--critical);margin-bottom:10px}
.alert h3{font-family:var(--font-reading);font-size:19px;font-weight:600;margin-bottom:9px}
.alert .why{font-family:var(--font-reading);font-size:15.5px;color:var(--text-secondary);margin-bottom:18px;max-width:68ch}
.opts{border:1px solid var(--border-subtle);border-radius:var(--rc);overflow:hidden}
.opt{display:flex;align-items:center;gap:14px;padding:11px 15px;font-size:14px}
.opt+.opt{border-top:1px solid var(--border-subtle)}
.opt .t{flex:1}.opt .amt{font-weight:600;color:var(--positive)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
color:var(--text-muted);padding:8px 12px;border-bottom:1px solid var(--border-subtle)}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--border-subtle)}
table.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--s1);min-width:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.note{font-size:12.5px;color:var(--text-muted);background:var(--surface-2);border:1px dashed var(--border-strong);
border-radius:var(--rc);padding:11px 14px;margin-bottom:22px}
dialog{border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface-1);
color:var(--text-primary);padding:0;max-width:820px;width:92vw;max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--border-subtle);font-weight:600}
.dlg-b{padding:0 20px 20px;overflow:auto;max-height:60vh}
.btn{font:inherit;font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:var(--rc);
border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.loading{padding:80px;text-align:center;color:var(--text-muted)}
@media(max-width:1000px){.shell{grid-template-columns:1fr;background:var(--surface-page)}.nav{display:none}
.tiles{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){.tiles{grid-template-columns:1fr}.page{padding:20px 14px 48px}}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 17h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M10 17c4 0 5-3.2 7-6.4S20.4 5 21 4.6" stroke="var(--brand)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="21" cy="4.6" r="1.9" fill="var(--brand)"/>
      </svg>
      <span>Ledger<span class="iq">IQ</span></span>
    </div>
    <a href="#" class="on">Home</a>
    <a href="#forecast">Forecast</a>
    <a href="#profit">Profit</a>
    <a href="#customers">Customers</a>
    <a href="#expenses">Expenses</a>
  </nav>
  <div>
    <header class="topbar">
      <span class="org" id="orgname">—</span>
      <span class="sp"></span>
      <span class="fresh"><span class="dot"></span> <span id="fresh">—</span></span>
      <button class="iconbtn" id="theme" aria-label="Toggle theme">◐</button>
    </header>
    <div class="page" id="page"><div class="loading">Loading…</div></div>
  </div>
</div>

<dialog id="drill">
  <div class="dlg-h"><span id="drill-title">Source transactions</span><span class="sp"></span>
    <button class="btn" onclick="document.getElementById('drill').close()">Close</button></div>
  <div class="dlg-b"><table class="tbl"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="n">Amount</th></tr></thead><tbody id="drill-body"></tbody></table></div>
</dialog>

<!-- A classic script, not type="module". The exported snapshot has to open from a
     file:// URL, and browsers treat file:// pages as an opaque origin, which makes
     module scripts a portability gamble for no benefit — nothing here imports. -->
<script>
// Two data sources, one page.
//
// Served live, this fetches from the metric engine. Exported by `npm run export`,
// the same figures are baked into `window.__SNAPSHOT__` ahead of the script and
// nothing is fetched at all — which is what makes the export openable from a
// file:// URL or a static host, with no database behind it. Both paths render
// through identical code, so a snapshot can't drift from the live product.
const SNAPSHOT = window.__SNAPSHOT__ ?? null;

const $ = (id) => document.getElementById(id);
// Function declaration, not a const arrow: render() runs before this point in
// source order, and a const binding would still be in its temporal dead zone.
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
const usd = (minor) => (minor / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const usdc = (minor) => (minor / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });

$('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const now = cur ?? (sysDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', now === 'dark' ? 'light' : 'dark');
  if (window.__data) render(window.__data);
};


async function drill(title, statement, from, to) {
  $('drill-title').textContent = title;
  $('drill-body').innerHTML = '<tr><td colspan="4">Loading…</td></tr>';
  $('drill').showModal();
  let rows;
  if (SNAPSHOT) {
    rows = SNAPSHOT.drilldowns[`${statement}|${from}|${to}`] ?? [];
  } else {
    const p = new URLSearchParams({ from, to });
    if (statement) p.set('statement', statement);
    rows = (await (await fetch('/api/drilldown?' + p)).json()).rows;
  }
  $('drill-body').innerHTML = rows.map((row) => `<tr>
    <td class="num">${row.date}</td>
    <td>${escapeHtml(row.description ?? row.merchant_name ?? '—')}</td>
    <td>${escapeHtml(row.category)}</td>
    <td class="n">${usdc(Math.round(Number(row.amount) * 100))}</td></tr>`).join('')
    || '<tr><td colspan="4">No transactions</td></tr>';
}
window.__drill = drill;

function render(d) {
  $('orgname').textContent = d.org.name;
  // A green dot next to a timestamp is a liveness claim. In an export nothing is
  // live, so it says what it actually is and drops the status colour with it.
  $('fresh').textContent = SNAPSHOT
    ? 'Snapshot · ' + new Date(d.asOf).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
    : 'Updated ' + new Date(d.asOf).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  if (SNAPSHOT) document.querySelector('.fresh .dot').style.background = 'var(--text-muted)';

  const m = d.metrics;
  const marginDelta = (m.margin.value !== null && m.marginPrior.value !== null)
    ? m.margin.value - m.marginPrior.value : null;
  const risk = d.forecast.riskEvents[0];

  // The answer bar: sentences first, charts later. This is the central product
  // bet (prd.md §2.1) — the user came here because they can't interpret charts.
  const headline = risk
    ? `Cash is ${m.runway.value !== null ? `about ${m.runway.value} months of runway` : 'holding steady'}. One thing needs you.`
    : `Cash is healthy${m.runway.value !== null ? ` — about ${m.runway.value} months of runway` : ''}. Nothing needs you today.`;

  const secondary = risk
    ? `<b>${risk.headline}</b> ${escapeHtml(risk.drivers[0] ?? '')}`
    : `Revenue over the last 12 months is ${usd(m.revenue.value ?? 0)}, with ${usd(m.profit.value ?? 0)} in net profit.`;

  $('page').innerHTML = `
    <div class="note">${SNAPSHOT
      ? `<b>Snapshot, not a live app.</b> These figures were computed on
         ${new Date(d.asOf).toLocaleDateString('en-US', { dateStyle: 'long' })} and frozen into this
         page — there is no database behind it and nothing here updates. The business is synthetic:
         a 22-person agency generated to have realistically messy books.`
      : `<b>Live demo.</b> Every figure below is computed on request by the metric engine.`}
      All of it came from ${d.series.length} months of transactions pulled through the real ingestion
      pipeline — fake QuickBooks server, real adapter, archive, checkpoints, and normalization.
      <b>Click Cash, Revenue, or Gross margin</b> to see the source transactions behind them.</div>

    <h1 class="greet">Good morning, Dana.</h1>

    <section class="answerbar">
      <p class="lead">${headline}</p>
      <p style="color:var(--text-secondary)">${secondary}</p>
    </section>

    <section class="tiles">
      ${tile('Cash', usd(m.cash.value ?? 0), null, m.cash, 'asset')}
      ${tile('Runway', m.runway.value !== null ? m.runway.value + ' mo' : '—', null, m.runway, null, m.runway.reason)}
      ${tile('Revenue <span style="color:var(--text-muted)">TTM</span>', usd(m.revenue.value ?? 0), null, m.revenue, 'revenue')}
      ${tile('Gross margin', m.margin.value !== null ? m.margin.value.toFixed(1) + '%' : '—',
             marginDelta, m.margin, 'cogs')}
    </section>

    <section class="card" id="forecast">
      <div class="card-h"><h2>Cash forecast</h2><span class="sp"></span>
        <span style="font-size:12.5px;color:var(--text-muted)">13 weeks · ${d.forecast.confidence} confidence</span></div>
      <div id="chart"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--s1)"></i> Projected (P50)</span>
        <span><i class="sw band"></i> P10–P90 range</span>
        <span><i class="sw" style="background:var(--text-muted);opacity:.6"></i> Payroll floor</span>
      </div>
      ${d.forecast.riskEvents.map((r) => `
        <div class="risk">
          <span class="glyph ${r.severity === 'critical' ? 'crit' : 'warn'}">${r.severity === 'critical' ? '!' : '•'}</span>
          <span style="flex:1"><b>${escapeHtml(r.headline)}</b>
            <span style="color:var(--text-secondary)">— ${escapeHtml(r.drivers[0] ?? '')}</span></span>
          <span class="pill ${r.severity === 'critical' ? 'crit' : 'warn'}">${r.severity}</span>
        </div>`).join('')
        || '<div class="risk"><span class="glyph warn">✓</span><span style="flex:1;color:var(--text-secondary)">No cash risks detected in the next 13 weeks.</span></div>'}
    </section>

    ${risk ? `
    <section class="alert">
      <div class="hd"><span>⚠</span> ${risk.severity} · ${risk.daysAway} days out</div>
      <h3>${escapeHtml(risk.headline)}</h3>
      <p class="why">${escapeHtml(risk.drivers.join(' '))}
        Projected shortfall of <b>${usdc(risk.shortfallMinor)}</b> at the midpoint of the forecast range.</p>
      <div class="opts">
        ${risk.actions.map((a) => `<div class="opt"><span class="t">${escapeHtml(a.text)}</span>
          ${a.impactMinor > 0 ? `<span class="amt num">+${usd(a.impactMinor)}</span>` : ''}</div>`).join('')}
      </div>
    </section>` : ''}

    <div class="grid2">
      <section class="card" id="profit">
        <div class="card-h"><h2>Revenue &amp; profit</h2></div>
        <div id="pchart"></div>
      </section>

      <section class="card" id="customers">
        <div class="card-h"><h2>Revenue by customer</h2><span class="sp"></span>
          ${d.concentration && d.concentration.share > 0.3
            ? `<span class="pill warn">${Math.round(d.concentration.share * 100)}% concentration</span>` : ''}</div>
        <div class="card-b"><table class="tbl"><tbody>
          ${d.breakdowns.byCustomer.slice(0, 8).map((c) => `<tr>
            <td>${escapeHtml(c.label)}</td>
            <td style="width:40%"><div class="bar" style="width:${Math.round(c.share * 100)}%"></div></td>
            <td class="n">${usd(c.value)}</td>
            <td class="n" style="color:var(--text-muted)">${Math.round(c.share * 100)}%</td></tr>`).join('')}
        </tbody></table></div>
      </section>
    </div>

    <div class="grid2">
      <section class="card" id="expenses">
        <div class="card-h"><h2>Expenses by category</h2><span class="sp"></span>
          <span style="font-size:12.5px;color:var(--text-muted)">trailing 12 months</span></div>
        <div class="card-b"><table class="tbl"><tbody>
          ${d.breakdowns.byCategory.slice(0, 9).map((c) => `<tr>
            <td>${escapeHtml(c.label)}</td>
            <td style="width:35%"><div class="bar" style="width:${Math.round(c.share * 100)}%;background:var(--s3)"></div></td>
            <td class="n">${usd(c.value)}</td></tr>`).join('')}
        </tbody></table></div>
      </section>

      <section class="card">
        <div class="card-h"><h2>What changed</h2><span class="sp"></span>
          <span style="font-size:12.5px;color:var(--text-muted)">last 30 days vs prior 30</span></div>
        <div class="card-b"><table class="tbl">
          <thead><tr><th>Category</th><th class="n">Last 30 days</th><th class="n">Change</th></tr></thead>
          <tbody>${d.drivers.map((dr) => `<tr>
            <td>${escapeHtml(dr.label)}</td>
            <td class="n">${usd(dr.currentMinor)}</td>
            <td class="n ${dr.deltaMinor > 0 ? 'down' : 'up'}">${dr.deltaMinor > 0 ? '▲' : '▼'} ${usd(Math.abs(dr.deltaMinor))}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </section>
    </div>

    <section class="card">
      <div class="card-h"><h2>Accounts receivable</h2></div>
      <div class="card-b"><table class="tbl">
        <thead><tr><th>Age</th><th class="n">Invoices</th><th class="n">Outstanding</th></tr></thead>
        <tbody>${d.breakdowns.aging.map((b) => `<tr>
          <td>${b.bucket}</td><td class="n">${b.count}</td>
          <td class="n ${b.bucket.startsWith('9') || b.bucket.startsWith('61') ? 'down' : ''}">${usd(b.minorUnits)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </section>

    <section class="card">
      <div class="card-h"><h2>Assumptions behind the forecast</h2></div>
      <div class="card-b"><table class="tbl"><tbody>
        ${d.forecast.assumptions.map((a) => `<tr>
          <td style="width:26%"><b>${escapeHtml(a.label)}</b></td>
          <td class="num" style="width:22%">${escapeHtml(a.value)}</td>
          <td style="color:var(--text-secondary)">${escapeHtml(a.description)}</td></tr>`).join('')}
      </tbody></table></div>
    </section>`;

  drawForecast(d);
  drawProfit(d);
}

function tile(label, value, delta, metric, statement, reason) {
  const period = metric.period;
  const onclick = statement
    ? `window.__drill('${label.replace(/<[^>]*>/g,'')}','${statement}','${period.start}','${period.end}')`
    : '';
  return `<button class="tile" ${onclick ? `onclick="${onclick}"` : ''}>
    <div class="lbl">${label}</div>
    <div class="val num">${value}</div>
    ${delta !== null && delta !== undefined
      ? `<div class="chg num ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta).toFixed(1)} pts vs last month</div>`
      : '<div class="chg" style="color:var(--text-muted)">&nbsp;</div>'}
    <div class="meta">${metric.confidence.replace('_',' ')} confidence${reason ? ' · ' + reason : ''}</div>
  </button>`;
}

function tok(n) {
  return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
}

function drawForecast(d) {
  const pts = d.forecast.points;
  if (!pts.length) return;
  const W = 960, H = 300, M = { t: 20, r: 70, b: 34, l: 62 };
  // Scale to the data, not to zero. Forcing zero into the domain squeezed the
  // entire series into the top fifth of the plot and made the P10-P90 band
  // invisible. Zero is included only when the projection actually approaches it,
  // which is when its position genuinely matters.
  const all = pts.flatMap((p) => [p.p10, p.p90]).concat([d.forecast.startingCashMinor]);
  let min = Math.min(...all), max = Math.max(...all);
  if (min > 0 && min < max * 0.25) min = 0;
  const pad = Math.max((max - min) * 0.15, max * 0.02);
  const lo = min - pad, hi = max + pad;
  const X = (i) => M.l + (i / (pts.length - 1)) * (W - M.l - M.r);
  const Y = (v) => H - M.b - ((v - lo) / (hi - lo)) * (H - M.t - M.b);

  // Payroll floor: the reference line that answers "will I make payroll?"
  // geometrically, before the user reads a single number.
  const payrollRisk = d.forecast.riskEvents.find((r) => r.kind === 'payroll_shortfall');
  const floor = payrollRisk ? payrollRisk.shortfallMinor + pts[pts.findIndex((p) => p.date === payrollRisk.date)]?.p50 : null;

  const c = { s1: tok('--s1'), grid: tok('--border-subtle'), muted: tok('--text-muted'),
              crit: tok('--critical'), surf: tok('--surface-1') };

  const band = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.p90).toFixed(1)}`).join(' L')
    + ' L' + [...pts].reverse().map((p, i) => `${X(pts.length - 1 - i).toFixed(1)},${Y(p.p10).toFixed(1)}`).join(' L');
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.p50).toFixed(1)}`).join(' ');

  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) / 4) * i, y = Y(v);
    grid += `<line x1="${M.l}" y1="${y}" x2="${W - M.r}" y2="${y}" stroke="${c.grid}"/>
      <text x="${M.l - 10}" y="${y + 4}" text-anchor="end" font-size="11" fill="${c.muted}"
        style="font-variant-numeric:tabular-nums">${(v / 100 / 1000).toFixed(0)}k</text>`;
  }

  let months = '';
  let lastMonth = '';
  pts.forEach((p, i) => {
    const mo = p.date.slice(0, 7);
    if (mo !== lastMonth) {
      lastMonth = mo;
      months += `<text x="${X(i)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="${c.muted}">
        ${new Date(p.date + 'T00:00:00Z').toLocaleString('en', { month: 'short', timeZone: 'UTC' })}</text>`;
    }
  });

  let riskMarks = '';
  for (const r of d.forecast.riskEvents) {
    const i = pts.findIndex((p) => p.date === r.date);
    if (i < 0) continue;
    riskMarks += `<circle cx="${X(i)}" cy="${Y(pts[i].p50)}" r="5" fill="${c.crit}" stroke="${c.surf}" stroke-width="2"/>
      <text x="${X(i)}" y="${Y(pts[i].p50) + 22}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${c.crit}">
        ${new Date(r.date + 'T00:00:00Z').toLocaleString('en', { month: 'short', day: 'numeric', timeZone: 'UTC' })}</text>`;
  }

  document.getElementById('chart').innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Cash forecast over the next 13 weeks with a P10 to P90 confidence band">
    ${grid}
    ${floor !== null ? `<line x1="${M.l}" y1="${Y(floor)}" x2="${W - M.r}" y2="${Y(floor)}"
      stroke="${c.muted}" stroke-width="1.5" stroke-dasharray="2 4" opacity=".75"/>
      <text x="${W - M.r + 8}" y="${Y(floor) + 4}" font-size="10.5" fill="${c.muted}">payroll</text>` : ''}
    <path d="M${band} Z" fill="${c.s1}" opacity=".16"/>
    <path d="${line}" fill="none" stroke="${c.s1}" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
    ${riskMarks}${months}
    <text x="${X(pts.length - 1) + 8}" y="${Y(pts[pts.length - 1].p50) + 4}" font-size="11.5" font-weight="600"
      fill="${c.s1}" style="font-variant-numeric:tabular-nums">${usd(pts[pts.length - 1].p50)}</text>
  </svg>`;
}

function drawProfit(d) {
  const s = d.series.slice(-18);
  if (!s.length) return;
  const W = 560, H = 240, M = { t: 16, r: 16, b: 30, l: 54 };
  const max = Math.max(...s.map((p) => Math.max(p.revenue, p.opex + p.cogs)));
  const X = (i) => M.l + (i / s.length) * (W - M.l - M.r);
  const bw = ((W - M.l - M.r) / s.length) * 0.42;
  const Y = (v) => H - M.b - (v / max) * (H - M.t - M.b);
  const c = { s1: tok('--s1'), s3: tok('--s3'), grid: tok('--border-subtle'), muted: tok('--text-muted') };

  let bars = '';
  s.forEach((p, i) => {
    // 2px surface gap between adjacent bars, per the mark specs.
    bars += `<rect x="${X(i)}" y="${Y(p.revenue)}" width="${bw}" height="${H - M.b - Y(p.revenue)}"
       fill="${c.s1}" rx="3"><title>${p.month} revenue ${usd(p.revenue)}</title></rect>
     <rect x="${X(i) + bw + 2}" y="${Y(p.cogs + p.opex)}" width="${bw}" height="${H - M.b - Y(p.cogs + p.opex)}"
       fill="${c.s3}" rx="3"><title>${p.month} costs ${usd(p.cogs + p.opex)}</title></rect>`;
  });

  let labels = '';
  s.forEach((p, i) => {
    if (i % 3 === 0) labels += `<text x="${X(i) + bw}" y="${H - 10}" text-anchor="middle" font-size="10" fill="${c.muted}">${p.month.slice(2)}</text>`;
  });

  document.getElementById('pchart').innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Monthly revenue against total costs for the last 18 months">
    <line x1="${M.l}" y1="${H - M.b}" x2="${W - M.r}" y2="${H - M.b}" stroke="${c.grid}"/>
    ${bars}${labels}
    <text x="${M.l - 8}" y="${Y(max) + 4}" text-anchor="end" font-size="10" fill="${c.muted}">${usd(max)}</text>
  </svg>
  <div class="legend" style="padding:0 20px 16px">
    <span><i class="sw" style="background:var(--s1)"></i> Revenue</span>
    <span><i class="sw" style="background:var(--s3)"></i> Costs</span></div>`;
}


// Charts read their colours from computed CSS custom properties, so they have to
// be redrawn when the theme changes. The button above handles our own toggle;
// this catches a host page (an embed, an artifact viewer) stamping data-theme on
// the root element, which would otherwise leave the SVGs in the old palette.
new MutationObserver(() => { if (window.__data) render(window.__data); })
  .observe(document.documentElement, { attributeFilter: ['data-theme'] });

// ── bootstrap ───────────────────────────────────────────────────────────────
// Last, deliberately: every helper above is defined by the time this runs.
void (async () => {
  if (SNAPSHOT) {
    window.__data = SNAPSHOT.dashboard;
    render(SNAPSHOT.dashboard);
    return;
  }
  const res = await fetch('/api/dashboard');
  if (!res.ok) {
    $('page').innerHTML = `<div class="loading">${(await res.json()).error}</div>`;
    return;
  }
  const data = await res.json();
  window.__data = data;
  render(data);
})();
</script>
</body>
</html>
